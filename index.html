<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>蓮 - REN - SLOT</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#050207;color:#fff;font-family:system-ui;text-align:center}
.wrap{max-width:620px;margin:auto;padding:14px}.title{font-size:29px;font-weight:900;text-shadow:0 0 18px #b000ff}.sub{color:#ddaaff;margin-bottom:12px}
.machine{border:2px solid #8d35c9;border-radius:22px;padding:14px;background:linear-gradient(#160a20,#050207);box-shadow:0 0 30px #7010a8}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reel{height:160px;border:2px solid #c56aff;border-radius:12px;background:#d8cedd;color:#16091b;display:flex;align-items:center;justify-content:center;font-size:62px;overflow:hidden;box-shadow:inset 0 0 18px #4b2058}
.stats{display:flex;justify-content:space-around;margin:14px 0;font-family:monospace}.num{color:#ff2450;font-size:26px}
button{touch-action:manipulation;border:2px solid #bd54ff;background:#14091e;color:white;border-radius:999px;padding:14px 18px;font-weight:900;font-size:17px;box-shadow:0 0 14px #7c21bd;margin:4px}
.lever{border-radius:12px;width:48%;font-size:20px}.stops{display:flex;justify-content:center}.stop{width:30%}.msg{min-height:30px;color:#efbaff;font-weight:800;margin:8px}
</style>
</head>
<body><div class="wrap">
<div class="title">壊して、また始まる。</div><div class="sub">蓮 - REN - SLOT　🐈‍⬛ 🎸 👿</div>
<div class="machine">
<div class="reels"><div class="reel" id="r0">🐈‍⬛</div><div class="reel" id="r1">🎸</div><div class="reel" id="r2">👿</div></div>
<div class="stats"><div>CREDIT<br><span class="num" id="credit">50</span></div><div>GAME<br><span class="num" id="game">0</span></div><div>TOTAL<br><span class="num" id="total">0</span></div></div>
<div class="msg" id="msg">MAX BET → LEVER → STOP</div>
<button id="bet">MAX BET</button><button class="lever" id="lever">🎸 LEVER</button>
<div class="stops"><button class="stop" data-i="0">STOP 1</button><button class="stop" data-i="1">STOP 2</button><button class="stop" data-i="2">STOP 3</button></div>
<button id="refill">🐈‍⬛ メダル追加 +50枚</button>
</div></div>
<script>
const S=['🐈‍⬛','🎸','👿','7','BAR','🍒','🌹','🔔','🖤'];
let credit=50,g=0,total=0,bet=false,spinning=false,pos=[0,1,2],stopped=[1,1,1],timer=[null,null,null];
const $=x=>document.getElementById(x);
function draw(){creditEl.textContent=credit;game.textContent=g;totalEl.textContent=total;pos.forEach((x,i)=>$('r'+i).textContent=S[x])}
const creditEl=$('credit'),game=$('game'),totalEl=$('total');
$('bet').onclick=()=>{if(spinning)return;if(credit<3){$('msg').textContent='メダルが足りない！補給してね';return}if(!bet){credit-=3;bet=true;$('msg').textContent='LEVER！';draw()}};
$('lever').onclick=()=>{if(spinning)return;if(!bet){$('msg').textContent='先にMAX BET！';return}spinning=true;g++;total++;stopped=[0,0,0];$('msg').textContent='壊して、また始まる。';for(let i=0;i<3;i++)timer[i]=setInterval(()=>{pos[i]=Math.floor(Math.random()*S.length);draw()},55+i*15);if(navigator.vibrate)navigator.vibrate(35);draw()};
document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(!spinning||stopped[i])return;clearInterval(timer[i]);stopped[i]=1;pos[i]=Math.floor(Math.random()*S.length);draw();if(stopped.every(Boolean)){spinning=false;bet=false;let win=0;if(pos[0]===pos[1]&&pos[1]===pos[2])win=S[pos[0]]==='7'?30:S[pos[0]]==='BAR'?15:12;else if(pos.filter(x=>S[x]==='🍒').length>=2)win=3;if(win){credit+=win;g=0;$('msg').textContent=win>=30?'⚡ BIG BONUS ⚡ 壊して、また始まる。':'WIN +'+win}else $('msg').textContent='NEXT GAME';draw()}});
$('refill').onclick=()=>{credit+=50;$('msg').textContent='🐈‍⬛ +50 MEDAL';if(navigator.vibrate)navigator.vibrate(25);draw()};draw();
</script></body></html>
